name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "ChiSara/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "ChiSara/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

# The Android project lives in the ChiSara/ subdirectory.
defaults:
  run:
    working-directory: ChiSara

jobs:
  build:
    name: Build debug APK & run unit tests
    runs-on: ubuntu-latest
    # Needed so the rolling pre-release step can create/update a release + tag.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ChiSara/**/*.gradle*', 'ChiSara/gradle/wrapper/gradle-wrapper.properties', 'ChiSara/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chisara-debug-apk
          path: ChiSara/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ChiSara/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Give the APK a nicer download filename, then publish it as a rolling
      # pre-release so there's a direct, login-free, non-zip download link.
      - name: Stage APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/chisara-latest.apk

      - name: Publish rolling pre-release with the APK
        if: github.ref == 'refs/heads/claude/chi-sara-notification-game-jbeby5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "Chi Sarà — ultima build (debug)"
          prerelease: true
          body: |
            APK di debug della build più recente di **Chi Sarà**.
            Scarica `chisara-latest.apk` qui sotto e installalo su un telefono Android reale.
            Build non firmata per il Play Store: Android chiederà conferma per l'installazione.
          files: ChiSara/app/build/outputs/apk/debug/chisara-latest.apk
